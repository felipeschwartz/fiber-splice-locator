cors:
  originPatterns: http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:5173,http://localhost:8081

app:
  storage:
    service-order-photos: /var/lib/my-application/service-order-photos
  # Só usado fora do perfil dev, e só com o banco sem nenhum usuário (primeira subida em produção).
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    name: ${INITIAL_ADMIN_NAME:Administrador}
    
spring:
  main:
    allow-circular-references: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: fiber_splice_locator
  datasource:
    driver-class-name: org.postgresql.Driver
    # url/username/password vêm de SPRING_DATASOURCE_*; os valores locais ficam no application-dev.yml.
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  profiles:
    # Padrão para desenvolvimento local; servidores sobrescrevem com SPRING_PROFILES_ACTIVE=prod.
    active: dev

resend:
  api-key: ${RESEND_API_KEY:local-dev-key}
  from: ${RESEND_FROM:onboarding@resend.dev}

security:
  jwt:
    # Sem valor padrão de propósito: fora do perfil dev a aplicação não sobe sem JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration: 28800000

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
  api-docs:
    enabled: true