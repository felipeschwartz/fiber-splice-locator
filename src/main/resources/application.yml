cors:
  originPatterns: http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:5173,https://fiber-splice-locator-front-web.onrender.com,http://localhost:8081

app:
  storage:
    service-order-photos: /var/lib/my-application/service-order-photos
    
spring:
  main:
    allow-circular-references: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: fiber_splice_locator
  datasource:
    driver-class-name: org.postgresql.Driver
    # Sem valor de produção fixo aqui — defina DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/
    # DB_PASSWORD nas variáveis de ambiente do Render antes do próximo deploy manual.
    # Localmente, sem essas variáveis, cai nos defaults do Postgres do docker-compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiber_splice_locator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234567890}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  profiles:
    active: dev

# Render bloqueia SMTP de saída, por isso usamos a API HTTP da Resend em vez de JavaMailSender.
resend:
  api-key: ${RESEND_API_KEY:local-dev-key}
  from: ${RESEND_FROM:onboarding@resend.dev}

security:
  jwt:
    # Idem: JWT_SECRET precisa ser definido no ambiente do Render. O valor
    # abaixo só serve de fallback pra rodar localmente.
    secret: ${JWT_SECRET:fiber-splice-locator-dev-only-secret-key}
    expiration: 28800000

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
  api-docs:
    enabled: true