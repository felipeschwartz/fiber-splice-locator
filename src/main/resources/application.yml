cors:
  originPatterns: http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:5173,https://fiber-splice-locator-front-web.onrender.com

app:
  storage:
    service-order-photos: /var/lib/my-application/service-order-photos
    
spring:
  main:
    allow-circular-references: true
  servlet:
    multipart:
      # Sem isso, o Spring Boot usa o padrão de 1MB por arquivo e barra fotos
      # tiradas direto da câmera antes mesmo da validação de 10MB do
      # ServiceOrderPhotoService (que já permite até esse tamanho).
      max-file-size: 15MB
      max-request-size: 15MB
  application:
    name: fiber_splice_locator
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://dpg-da2qagon74is738girdg-a:5432/fiber_splice_locator
    #url: jdbc:postgresql://localhost:5432/fiber_splice_locator
    username: fiber_splice_locator_user
    #username: postgres
    password: C2uyC9elAF9SY2XIbWxCl3TfgdZrmxrz
    #password: 1234567890
  jpa:
    hibernate:
      ddl-auto: update
      #ddl-auto: create-drop
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  profiles:
    active: dev

# Render bloqueia conexões de saída nas portas de SMTP (587/465/25), então
# e-mail é enviado via API HTTP da Resend em vez de JavaMailSender/SMTP.
# "from" só pode ser um endereço arbitrário depois de verificar um domínio
# próprio no dashboard da Resend; sem isso, use o domínio de sandbox deles.
resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM:onboarding@resend.dev}

security:
  jwt:
    secret: fiber-splice-locator-secret-key-2026
    expiration: 28800000

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true
  api-docs:
    enabled: true