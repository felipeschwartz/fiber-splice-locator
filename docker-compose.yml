services:
  db:
    image: felipeschwartz/postgres:18
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fiber-splice-locator-network

  fiber-splice-locator:
    build:
      context: .
      dockerfile: Dockerfile
    image: felipeschwartz/fiber-splice-locator:latest
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fiber-splice-locator-network
    volumes:
      - ./service-order-photos:/var/lib/my-application/service-order-photos

  portainer:
    image: felipeschwartz/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - fiber-splice-locator-network

volumes:
  postgres_data:
  portainer_data:
  service-order-photos:

networks:
  fiber-splice-locator-network:
    driver: bridge